<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Gemini session expiry fixture</title>
  </head>
  <body>
    <main>
      <div contenteditable="true" role="textbox"></div>
      <button id="send" type="button" aria-label="Send">Send</button>
      <model-response>old response</model-response>

      });
