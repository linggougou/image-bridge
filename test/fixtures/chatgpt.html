<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ChatGPT fixture</title>
  </head>
  <body>
    <main>
      <div id="prompt-textarea" contenteditable="true" role="textbox"></div>
      <button id="composer-submit-button" type="button" aria-label="Send">Send</button>
      <section id="thread">
        <article data-testid="conversation-turn-1">
          <div data-message-author-role="assistant">
            <img id="old-image" alt="old generated image" />
          </div>
        </article>
      </section>
    </main>
    <script>
      const canvas = document.createElement("canvas");
      canvas.width = 256;
      canvas.height = 256;
      const context = canvas.getContext("2d");
      context.fillStyle = "#356859";
      context.fillRect(0, 0, 256, 256);
      const dataUrl = canvas.toDataURL("image/png");
      document.querySelector("#old-image").src = dataUrl;

      document.querySelector("#composer-submit-button").addEventListener("click", () => {
        const userTurn = document.createElement("article");
        userTurn.dataset.testid = "conversation-turn-2";
        userTurn.innerHTML = '<div data-message-author-role="user">prompt</div>';

        const assistantTurn = document.createElement("article");
        assistantTurn.dataset.testid = "conversation-turn-3";
        const message = document.createElement("div");
        message.dataset.messageAuthorRole = "assistant";
        const image = document.createElement("img");
        image.id = "new-image";
        image.alt = "new generated image";
        image.src = dataUrl;
        message.appendChild(image);
        assistantTurn.appendChild(message);

        document.querySelector("#thread").append(userTurn, assistantTurn);
      });
    </script>
  </body>
</html>
